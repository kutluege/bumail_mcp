name: Release

# Push a tag like v0.1.0 to build the Claude Desktop bundle (.mcpb) and attach it to a
# GitHub Release. The tag must match the version in manifest.json and pyproject.toml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the .mcpb

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  MCPB_VERSION: "2.1.2" # @anthropic-ai/mcpb CLI, pinned exactly

jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check the tag matches manifest.json and pyproject.toml
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag=$version manifest.json=$manifest pyproject.toml=$project"
          if [ "$version" != "$manifest" ] || [ "$version" != "$project" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json ($manifest) and pyproject.toml ($project)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The bundle runs `uv run --frozen`, so the shipped uv.lock must match pyproject.toml.
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run pytest -m "not greenmail" -q

      - name: Validate manifest.json
        run: npx -y "@anthropic-ai/mcpb@${MCPB_VERSION}" validate manifest.json
      - name: Pack the bundle
        run: npx -y "@anthropic-ai/mcpb@${MCPB_VERSION}" pack . "dist/posta-mcp-${{ steps.version.outputs.version }}.mcpb"
      - name: Check the bundle contents
        env:
          BUNDLE: dist/posta-mcp-${{ steps.version.outputs.version }}.mcpb
        run: |
          unzip -Z1 "$BUNDLE" | sort | tee bundle-files.txt
          for required in manifest.json pyproject.toml uv.lock README.md LICENSE icon.png src/posta_mcp/__main__.py src/posta_mcp/presets/bogazici.toml; do
            grep -qx "$required" bundle-files.txt || { echo "::error::$required is missing from the bundle"; exit 1; }
          done
          if grep -E '^(tests|docs|scripts|\.git|\.github|\.venv|\.claude|\.claude-plugin)/|^\.mcp\.json$|__pycache__|\.pyc$' bundle-files.txt; then
            echo "::error::unwanted files in the bundle (see above)"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: dist/posta-mcp-${{ steps.version.outputs.version }}.mcpb
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$BUNDLE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$BUNDLE" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "Boğaziçi Postanesi $GITHUB_REF_NAME"
          fi
