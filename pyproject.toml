[project]
name = "posta-mcp"
version = "0.1.0"
description = "Local-first MCP server for your email over IMAP/SMTP, with institution presets (Boğaziçi first)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "imapclient>=4.1",
    "keyring>=25",
    "platformdirs>=4",
    "pydantic>=2.10",
]

[project.scripts]
posta-mcp = "posta_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posta_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["greenmail: needs a running GreenMail server"]

[tool.ruff]
line-length = 100
target-version = "py311"
