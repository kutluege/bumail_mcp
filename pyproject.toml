[project]
name = "posta-mcp"
version = "0.1.0"
description = "Local-first MCP server for your email over IMAP/SMTP, with institution presets (Boğaziçi first)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ege Kutlu" }]
keywords = ["mcp", "model-context-protocol", "email", "imap", "smtp", "bogazici", "bumail"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email :: Post-Office :: IMAP",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "imapclient>=4.1",
    "keyring>=25",
    "platformdirs>=4",
    "pydantic>=2.10",
]

[project.urls]
Homepage = "https://github.com/kutluege/bumail_mcp"
Repository = "https://github.com/kutluege/bumail_mcp"
Issues = "https://github.com/kutluege/bumail_mcp/issues"

[project.scripts]
posta-mcp = "posta_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posta_mcp"]  # includes presets/*.toml (package data)

[tool.hatch.build.targets.sdist]
include = ["src/posta_mcp", "tests", "scripts", "docs", "README.md", "LICENSE", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["greenmail: needs a running GreenMail server"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
